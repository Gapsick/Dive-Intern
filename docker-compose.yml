services:
  db:
    image: mysql:8.0
    container_name: dive-intern-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dive_intern
      MYSQL_USER: dive
      MYSQL_PASSWORD: dive1234
    ports:
      - "13306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dive-intern-backend
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dive
      DB_PASSWORD: dive1234
      DB_NAME: dive_intern
      JWT_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/db:/app/db

  seeder:
    image: mysql:8.0
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend/db/seed:/seed
    command: >
      bash -c "sleep 15 &&
      mysql -h db -u dive -pdive1234 --default-character-set=utf8mb4 dive_intern < /seed/mock_data.sql"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dive-intern-frontend
    restart: unless-stopped
    ports:
      - "8080:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  db_data: